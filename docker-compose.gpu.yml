# =============================================
# Gen3ia — GPU Server Docker Compose
# =============================================
# Architecture: Tier 3 — GPU Server
# Noyau de calcul Rust/WebGPU + services IA lourds
#
# Gen3ia Backend communique avec ces services via API:
#
#   Gen3ia Backend  →  API IA (Compute Engine)  →  GPU Server
#        ↓                                    ↓
#   BullMQ Queue                     WebGPU / ComfyUI / ASR / Video
#
# Start: docker compose -f docker-compose.gpu.yml up -d
# =============================================

services:
  # =============================================
  # Compute Engine — Noyau de calcul Rust/WebGPU
  # =============================================
  compute-engine:
    build:
      context: ./crates/compute-engine
      dockerfile: Dockerfile
    container_name: gen3ia-compute
    restart: unless-stopped
    ports:
      - "8190:8190"
    volumes:
      - compute_models:/app/models
      - compute_cache:/app/cache
    environment:
      PORT: 8190
      RUST_LOG: info
      WG_PRIORITY: high
      MEMORY_LIMIT_GB: 8
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility, compute]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8190/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # =============================================
  # ComfyUI — Image Generation (GPU Required)
  # =============================================
  comfyui:
    build:
      context: ./services/comfyui
      dockerfile: Dockerfile
    container_name: gen3ia-comfyui
    restart: unless-stopped
    ports:
      - "8188:8188"
    volumes:
      - comfyui_models:/app/models
      - comfyui_output:/app/output
    environment:
      PORT: 8188
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8188/system_stats"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # =============================================
  # SpeechBrain — ASR/LLM Server (GPU Required)
  # =============================================
  speechbrain:
    build:
      context: ./services/speechbrain
      dockerfile: Dockerfile
    container_name: gen3ia-speechbrain
    restart: unless-stopped
    ports:
      - "8187:8187"
    volumes:
      - speechbrain_models:/app/models
    environment:
      PORT: 8187
      MODEL: speechbrain/asr-conformer-transformerlm-librispeech
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8187/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # =============================================
  # Video API — CogVideo/VideoCrafter (GPU Required)
  # =============================================
  video-api:
    build:
      context: ./services/video
      dockerfile: Dockerfile
    container_name: gen3ia-video-api
    restart: unless-stopped
    ports:
      - "8189:8189"
    volumes:
      - video_models:/app/models
      - video_output:/app/output
    environment:
      PORT: 8189
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8189/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

# =============================================
# Volumes
# =============================================
volumes:
  compute_models:
    driver: local
  compute_cache:
    driver: local
  comfyui_models:
    driver: local
  comfyui_output:
    driver: local
  speechbrain_models:
    driver: local
  video_models:
    driver: local
  video_output:
    driver: local
