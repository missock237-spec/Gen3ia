# ============================================================
# Gen3ia Staging — Traefik Configuration
# Reverse proxy avec TLS simulé pour staging
# ============================================================

api:
  dashboard: true
  debug: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: gen3ia-staging
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

certificatesResolvers:
  staging:
    acme:
      caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      email: ${ACME_EMAIL:-admin@gen3ia.ai}
      storage: /certificates/acme.json
      httpChallenge:
        entryPoint: web

log:
  level: INFO
  format: json

accessLog:
  filePath: /var/log/traefik/access.log
  format: json
