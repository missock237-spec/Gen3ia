# ============================================================
# Gen3ia Staging — Redis Configuration
# Optimisé pour staging (mémoire limitée, pas de persistence RDB)
# ============================================================

# Limiter la mémoire
maxmemory 256mb
maxmemory-policy allkeys-lru

# Pas de persistence sur disque en staging
save ""
appendonly no

# Limiter les connexions
maxclients 100
timeout 300

# Performance
tcp-keepalive 60
lfu-log-factor 10
lfu-decay-time 1

# Sécurité
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command SHUTDOWN ""
