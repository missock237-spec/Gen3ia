# ============================================================
# Gen3ia — Grafana Datasource Configuration
# ============================================================
# Provisionne automatiquement Prometheus + Loki au démarrage.
# ============================================================

apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    orgId: 1
    url: http://prometheus:9090
    basicAuth: false
    isDefault: false
    editable: true
    version: 1
    jsonData:
      prometheusType: Prometheus
      prometheusVersion: 3.2.1
      timeInterval: "15s"
      queryTimeout: "30s"
      httpMethod: POST

  - name: Loki
    type: loki
    access: proxy
    orgId: 1
    url: http://loki:3100
    basicAuth: false
    isDefault: true
    editable: true
    version: 1
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: traceID
          matcherRegex: "trace_id=(\\w+)"
          url: "$${__value.raw}"
          urlDisplayLabel: "View Trace"
