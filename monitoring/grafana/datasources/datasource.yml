apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    orgId: 1
    url: http://prometheus:9090
    basicAuth: false
    isDefault: true
    editable: true
    version: 1
    jsonData:
      prometheusType: Prometheus
      prometheusVersion: 3.2.1
      timeInterval: "15s"
      queryTimeout: "30s"
      httpMethod: POST
