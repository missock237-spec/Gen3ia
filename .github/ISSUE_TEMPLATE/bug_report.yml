name: 🐛 Bug Report
description: Signaler un bug pour aider à améliorer Genova
title: "[BUG] "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler ce bug !
  - type: textarea
    id: description
    attributes:
      label: Description du bug
      description: Décrivez clairement le problème
      placeholder: Quand j'essaie de..., l'application...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Étapes pour reproduire
      description: Comment reproduire le bug ?
      placeholder: |
        1. Aller sur...
        2. Cliquer sur...
        3. Voir l'erreur...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
      description: Que devrait-il se passer normalement ?
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environnement
      options:
        - Production
        - Développement
        - Docker
        - Vercel
    validations:
      required: true
  - type: input
    id: logs
    attributes:
      label: Logs d'erreur
      description: Copiez les logs d'erreur ici
      render: shell