name: CI

# ============================================================
# CI tourne sur TOUTES les branches pour valider chaque push
# et permettre le déploiement preview Vercel sur chacune.
# Installeur: npm (cohérent avec package-lock.json + vercel.json).
# ============================================================
on:
  push:
    branches:
      - '**'
  pull_request:
    branches: [ main ]

permissions: { contents: read }

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Install & Cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install --legacy-peer-deps

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install --legacy-peer-deps
      - run: npm run lint
        continue-on-error: true  # warnings non bloquants

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install --legacy-peer-deps
      - run: npx tsc --noEmit
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        continue-on-error: true  # erreurs TS pré-existantes non bloquantes

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install --legacy-peer-deps
      - run: npx vitest run
        continue-on-error: true

  build:
    name: Next.js Build (validate deployment readiness)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install --legacy-peer-deps
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          # Fallbacks pour que le build ne bloque pas si un secret est absent
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'
          AUTH_SECRET: 'placeholder-dev-secret'
          NEXTAUTH_SECRET: 'placeholder-dev-secret'
          NEXTAUTH_URL: 'http://localhost:3000'
