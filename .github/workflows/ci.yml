name: CI

on:
  push:
    branches: [main, develop, 'fix/**', 'feat/**']
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun x prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/genova_test

      - name: TypeScript check
        run: bun x tsc --noEmit

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: genova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      GENOVA_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/genova_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/genova_test
      AUTH_SALT: test-salt-for-ci-only-not-production
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun x prisma generate

      - name: Apply DB schema
        run: bun x prisma db push --skip-generate

      - name: Run tests
        run: bun run test --coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun x prisma generate
        env:
          DATABASE_URL: postgresql://localhost/dummy

      - name: Build
        run: bun x next build
        env:
          DATABASE_URL: postgresql://localhost/dummy
          GENOVA_DATABASE_URL: postgresql://localhost/dummy
          AUTH_SALT: ci-build-only
          NEXT_PUBLIC_APP_URL: http://localhost:3000
