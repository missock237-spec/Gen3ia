name: Sync Secrets to Vercel
on:
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g vercel
      - name: Sync env vars to Vercel
        run: |
          echo "Sync vars depuis GitHub Secrets vers Vercel..."
          vercel link --project gen3ia --token=${{ secrets.VERCEL_TOKEN }} --yes 2>/dev/null || true
          for VAR in DATABASE_URL AUTH_SECRET NEXTAUTH_SECRET NEXTAUTH_URL NEXT_PUBLIC_APP_URL NODE_ENV REDIS_URL OPENAI_API_KEY ANTHROPIC_API_KEY HUGGINGFACE_TOKEN STRIPE_SECRET_KEY NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY STRIPE_WEBHOOK_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET SENTRY_DSN; do
            echo "${{ secrets[VAR] }}" | vercel env add "$VAR" production --token=${{ secrets.VERCEL_TOKEN }} --yes 2>/dev/null || true
          done
      - name: Deploy to Vercel
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
