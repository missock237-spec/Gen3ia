# ============================================================
# DEPENDABOT — Mises à jour automatiques des dépendances
# ============================================================
# Vérifie quotidiennement les dépendances et crée des PR
# pour les mises à jour de sécurité et de version.
# ============================================================

version: 2
updates:
  # Dépendances npm (Bun)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "08:00"
      timezone: "Africa/Douala"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automerge"
    # Ne pas faire de PR pour les mises à jour mineures de devDependencies
    ignore:
      - dependency-name: "@types/*"
        update-types: ["version-update:semver-patch"]
    reviewers:
      - "missock237-spec"
    # Groupes de dépendances pour réduire le nombre de PR
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "next"
          - "eslint-config-next"
      radix-ui:
        patterns:
          - "@radix-ui/*"
      dnd-kit:
        patterns:
          - "@dnd-kit/*"
    # Les PR de sécurité sont prioritaires
    pull-request-branch-name:
      separator: "-"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"

  # Dépendances Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "docker"
      - "dependencies"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "github-actions"
      - "dependencies"