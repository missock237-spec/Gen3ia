# ============================================================
# Gen3ia — Monitoring Stack
# Prometheus + Grafana + Node Exporter + cAdvisor
# ============================================================
# Usage:
#   docker compose -f docker-compose.monitoring.yml up -d
#   Grafana: http://localhost:3001 (admin/admin)
#   Prometheus: http://localhost:9090
# ============================================================

version: "3.9"

services:
  # === Prometheus (collecte de métriques) ===
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: gen3ia-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - gen3ia-monitoring

  # === Node Exporter (métriques système) ===
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: gen3ia-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - gen3ia-monitoring

  # === cAdvisor (métriques Docker) ===
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    container_name: gen3ia-cadvisor
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    networks:
      - gen3ia-monitoring

  # === Grafana (visualisation) ===
  grafana:
    image: grafana/grafana:11.5.2
    container_name: gen3ia-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_SERVER_ROOT_URL: http://localhost:3001
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "true"
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - gen3ia-monitoring

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  gen3ia-monitoring:
    driver: bridge
