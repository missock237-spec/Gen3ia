# ============================================================
# Genova — Docker Compose pour le développement local
# ============================================================
# Usage: docker-compose -f docker-compose.dev.yml up -d
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: genova-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: genova
      POSTGRES_PASSWORD: genova
      POSTGRES_DB: genova
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genova"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: genova-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: