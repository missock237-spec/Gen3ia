events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # ============================================================
    # Configuration de base
    # ============================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 50M;
    
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ============================================================
    # Logging
    # ============================================================
    log_format json escape=json '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr"}';

    access_log /var/log/nginx/access.log json;
    error_log /var/log/nginx/error.log warn;

    # ============================================================
    # Rate limiting
    # ============================================================
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=static:10m rate=100r/s;

    # ============================================================
    # Serveur HTTP -> HTTPS redirection
    # ============================================================
    server {
        listen 80;
        server_name genova-ai.com www.genova-ai.com;
        return 301 https://$server_name$request_uri;
    }

    # ============================================================
    # Serveur HTTPS
    # ============================================================
    server {
        listen 443 ssl http2;
        server_name genova-ai.com www.genova-ai.com;

        # SSL (à configurer avec certbot ou vos certificats)
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ============================================================
        # Static assets (cache 1 an)
        # ============================================================
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js|woff2?)$ {
            root /var/www;
            expires 365d;
            add_header Cache-Control "public, immutable";
            access_log off;
            limit_req zone=static burst=50;
        }

        # ============================================================
        # Service Worker (ne pas cacher)
        # ============================================================
        location = /sw.js {
            root /var/www;
            expires -1;
            add_header Cache-Control "no-cache, must-revalidate";
            add_header Service-Worker-Allowed "/";
        }

        # ============================================================
        # API (proxy vers Genova)
        # ============================================================
        location /api/ {
            proxy_pass http://genova:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
            
            # Rate limiting pour les API
            limit_req zone=api burst=20 nodelay;
        }

        # ============================================================
        # Application Next.js
        # ============================================================
        location / {
            proxy_pass http://genova:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # ============================================================
        # Health check endpoint
        # ============================================================
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
