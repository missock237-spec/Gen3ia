name: Sync Secrets to Vercel & Render
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  sync:
    name: Sync & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          echo "=== Sync to Vercel ==="
          TOKEN="${{ secrets.VERCEL_TOKEN }}"
          if [ -z "$TOKEN" ]; then echo "VERCEL_TOKEN manquant"; exit 1; fi
          npm install -g vercel
          for VAR in \
            "DATABASE_URL:${{ secrets.DATABASE_URL }}" \
            "AUTH_SECRET:${{ secrets.AUTH_SECRET }}" \
            "NEXTAUTH_SECRET:${{ secrets.NEXTAUTH_SECRET }}" \
            "OPENAI_API_KEY:${{ secrets.OPENAI_API_KEY }}" \
            "GOOGLE_CLIENT_ID:${{ secrets.GOOGLE_CLIENT_ID }}" \
            "GOOGLE_CLIENT_SECRET:${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            "GITHUB_CLIENT_ID:${{ secrets.GITHUB_CLIENT_ID }}" \
            "GITHUB_CLIENT_SECRET:${{ secrets.GITHUB_CLIENT_SECRET }}"; do
            K="${VAR%%:*}"; V="${VAR#*:}"
            [ -n "$V" ] && vercel env add "$K" production --token "$TOKEN" --yes <<< "$V" 2>/dev/null || true
          done
          vercel deploy --prod --token "$TOKEN" --yes 2>&1
          echo "=== Sync to Render ==="
          KEY="${{ secrets.RENDER_API_KEY }}"
          HOOK="${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          if [ -n "$KEY" ]; then
            SVC=$(curl -s -H "Authorization: Bearer $KEY" \
              https://api.render.com/v1/services | jq -r '.[] | select(.name=="gen3ia-api" or .name=="gen3ia-app") | .id' | head -1)
            if [ -n "$SVC" ]; then
              for K in DATABASE_URL AUTH_SECRET NEXTAUTH_SECRET OPENAI_API_KEY \
                GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET; do
                eval "VAL=\$$(echo \${{ secrets.$K }})"
                [ -n "$VAL" ] && curl -s -X PUT \
                  "https://api.render.com/v1/services/$SVC/env-vars/$K" \
                  -H "Authorization: Bearer $KEY" \
                  -H "Content-Type: application/json" \
                  -d "{\"value\":\"$VAL\"}" > /dev/null
              done
            fi
            [ -n "$HOOK" ] && curl -s -X POST "$HOOK"
          fi
          echo "Done!"
