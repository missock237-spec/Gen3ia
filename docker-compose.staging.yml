# ============================================================
# Gen3ia — Environnement de Staging (production-like)
# Usage:
#   docker compose -f docker-compose.staging.yml up -d
#   docker compose -f docker-compose.staging.yml logs -f app
#
# Services: app (x2), redis, qdrant, workers,
#           traefik, prometheus, loki, grafana, promtail,
#           node-exporter, cadvisor
#
# Base de donnees applicative : Firestore (Firebase) — pas de PostgreSQL.
# ============================================================

name: gen3ia-staging

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck: &app-healthcheck
  test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 40s

x-deploy: &default-deploy
  restart_policy:
    condition: any
    delay: 5s
    max_attempts: 3
  resources:
    limits:
      cpus: "0.5"
      memory: "512M"
    reservations:
      cpus: "0.25"
      memory: "256M"

x-env: &app-env
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: 1
  PORT: 3000
  HOSTNAME: "0.0.0.0"
  # Firebase (Admin SDK — serveur)
  FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
  FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
  FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
  FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
  REDIS_URL: redis://redis:6379
  QDRANT_URL: http://qdrant:6333
  VECTOR_STORE_TYPE: qdrant
  AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
  NEXTAUTH_SECRET: ${AUTH_SECRET}
  NEXTAUTH_URL: ${STAGING_URL:-https://staging.gen3ia.ai}
  NEXT_PUBLIC_APP_URL: ${STAGING_URL:-https://staging.gen3ia.ai}
  NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
  NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
  LOG_LEVEL: info
  LOKI_URL: http://loki:3100
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}

services:
  # ============================================================
  # REVERSE PROXY
  # ============================================================
  traefik:
    image: traefik:v3.3.5
    container_name: gen3ia-staging-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring/traefik/staging.yml:/etc/traefik/traefik.yml:ro
      - ./monitoring/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${STAGING_DOMAIN:-localhost}`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=auth"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - gen3ia-staging

  # ============================================================
  # CACHE & VECTEURS
  # ============================================================

  redis:
    image: redis:7-alpine
    container_name: gen3ia-staging-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      <<: *default-deploy
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
    networks:
      - gen3ia-staging

  qdrant:
    image: qdrant/qdrant:v1.13.5
    container_name: gen3ia-staging-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_staging_data:/qdrant/storage
      - ./monitoring/qdrant/config.yaml:/qdrant/config/production.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      <<: *default-deploy
      resources:
        limits:
          cpus: "1"
          memory: "1G"
    networks:
      - gen3ia-staging

  # ============================================================
  # APPLICATION (2 replicas)
  # ============================================================

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        - NODE_ENV=production
    image: gen3ia:staging
    container_name: gen3ia-staging-app
    restart: unless-stopped
    ports:
      - "3000"
    environment:
      <<: *app-env
    volumes:
      - gen3ia_workspace:/tmp/gen3ia-workspace
    depends_on:
      redis: { condition: service_healthy }
      qdrant: { condition: service_started }
    healthcheck: *app-healthcheck
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.gen3ia-staging.loadbalancer.server.port=3000"
      - "traefik.http.services.gen3ia-staging.loadbalancer.sticky.cookie=true"
      - "traefik.http.services.gen3ia-staging.loadbalancer.sticky.cookie.name=gen3ia_staging"
      - "traefik.http.routers.gen3ia-staging.rule=Host(`${STAGING_DOMAIN:-localhost}`)"
      - "traefik.http.routers.gen3ia-staging.entrypoints=websecure"
      - "traefik.http.routers.gen3ia-staging.tls=true"
    deploy:
      mode: replicated
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      rollback_config:
        parallelism: 1
        order: stop-first
      <<: *default-deploy
    logging: *default-logging
    networks:
      - gen3ia-staging

  app-2:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: gen3ia:staging
    container_name: gen3ia-staging-app-2
    restart: unless-stopped
    ports:
      - "3001"
    environment:
      <<: *app-env
    volumes:
      - gen3ia_workspace:/tmp/gen3ia-workspace
    depends_on:
      redis: { condition: service_healthy }
      qdrant: { condition: service_started }
    healthcheck: *app-healthcheck
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.gen3ia-staging.loadbalancer.server.port=3000"
    deploy:
      <<: *default-deploy
    logging: *default-logging
    networks:
      - gen3ia-staging

  # ============================================================
  # WORKERS (BullMQ)
  # ============================================================

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: gen3ia:worker-staging
    container_name: gen3ia-staging-worker
    restart: unless-stopped
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: 10
      WORKER_QUEUE: agent-execution
    depends_on:
      redis: { condition: service_healthy }
    deploy:
      replicas: 2
      <<: *default-deploy
      resources:
        limits:
          cpus: "1"
          memory: "512M"
    logging: *default-logging
    networks:
      - gen3ia-staging

  # ============================================================
  # MONITORING (Prometheus + Loki + Grafana)
  # ============================================================

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: gen3ia-staging-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_staging_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - app
    networks:
      - gen3ia-staging

  loki:
    image: grafana/loki:3.4.2
    container_name: gen3ia-staging-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command:
      - '-config.file=/etc/loki/loki-config.yml'
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_staging_data:/loki
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - gen3ia-staging

  promtail:
    image: grafana/promtail:3.4.2
    container_name: gen3ia-staging-promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/loki/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - '-config.file=/etc/promtail/promtail-config.yml'
    depends_on:
      - loki
    networks:
      - gen3ia-staging

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: gen3ia-staging-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - gen3ia-staging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    container_name: gen3ia-staging-cadvisor
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    networks:
      - gen3ia-staging

  grafana:
    image: grafana/grafana:11.5.2
    container_name: gen3ia-staging-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_staging}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_SERVER_ROOT_URL: ${STAGING_URL:-http://localhost:3001}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "true"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_staging_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      <<: *default-deploy
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
    networks:
      - gen3ia-staging

volumes:
  redis_staging_data:
    driver: local
  qdrant_staging_data:
    driver: local
  prometheus_staging_data:
    driver: local
  loki_staging_data:
    driver: local
  grafana_staging_data:
    driver: local
  gen3ia_workspace:
    driver: local

networks:
  gen3ia-staging:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
