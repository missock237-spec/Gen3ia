version: '3.8'

services:
  # ============================================================
  # Genova AI — Application principale
  # ============================================================
  genova:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: genova-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://genova:genova_pass@postgres:5432/genova
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - NEXT_PUBLIC_APP_URL=https://app.genova-ai.com
      - AUTH_SALT=${AUTH_SALT}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - SERPAPI_API_KEY=${SERPAPI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_healthy
    volumes:
      - genova_uploads:/app/public/uploads
      - genova_data:/app/data
    networks:
      - genova-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/ai/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ============================================================
  # PostgreSQL — Base de données principale
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: genova-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=genova
      - POSTGRES_PASSWORD=genova_pass
      - POSTGRES_DB=genova
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/migrations:/docker-entrypoint-initdb.d
    networks:
      - genova-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genova"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Redis — Cache, files d'attente, rate limiting
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: genova-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - genova-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Qdrant — Base vectorielle pour la mémoire des agents
  # ============================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: genova-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - genova-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================
  # Nginx — Reverse proxy (optionnel, production)
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: genova-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - genova_uploads:/var/www/uploads
    depends_on:
      - genova
    networks:
      - genova-network

# ============================================================
# Volumes
# ============================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  genova_uploads:
    driver: local
  genova_data:
    driver: local

# ============================================================
# Networks
# ============================================================
networks:
  genova-network:
    driver: bridge
