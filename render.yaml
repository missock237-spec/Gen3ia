# ============================================================
# Render Blueprint — Gen3ia AI Agent OS
# Backend: API, Workers, PostgreSQL, Redis
# Frontend: Vercel (gen3ia.vercel.app)
# Paiement: SebPay (Mobile Money Afrique)
# ============================================================
services:
  - type: web
    name: gen3ia-api
    runtime: image
    plan: starter
    autoDeploy: true
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      # === Production ===
      - key: NODE_ENV
        value: production
      - key: RENDER_DEPLOY
        value: "true"
      - key: PORT
        value: "3000"
      - key: NEXT_PUBLIC_APP_URL
        fromService:
          type: web
          name: gen3ia-api
          property: host
      - key: NEXTAUTH_URL
        fromService:
          type: web
          name: gen3ia-api
          property: host
      - key: VERCEL_FRONTEND_URL
        value: https://gen3ia.vercel.app

      # === Secrets (Configurer dans Render Dashboard > Environment) ===
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: HUGGINGFACE_TOKEN
        sync: false

      # === OAuth ===
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

      # === SebPay (Mobile Money) ===
      - key: SEBPAY_API_KEY
        sync: false
      - key: SEBPAY_API_SECRET
        sync: false
      - key: SEBPAY_WEBHOOK_SECRET
        sync: false

      - key: SEED_DATABASE
        value: "false"

    disks:
      - name: gen3ia-data
        mountPath: /tmp/gen3ia-data
        sizeGB: 10

  - type: cron
    name: gen3ia-refresh-tokens
    runtime: image
    schedule: "0 */4 * * *"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: false
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        fromService:
          type: web
          name: gen3ia-api
          property: host
