# ============================================================
# Render Blueprint — Gen3ia AI Agent OS
# Paiement: SebPay (Mobile Money Afrique)
# ============================================================
services:
  - type: web
    name: gen3ia-app
    runtime: image
    plan: starter
    autoDeploy: true
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        fromService:
          type: web
          name: gen3ia-app
          property: host
      - key: NEXT_PUBLIC_APP_URL
        fromService:
          type: web
          name: gen3ia-app
          property: host
      - key: OPENAI_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: SEBPAY_API_KEY
        sync: false
      - key: SEBPAY_API_SECRET
        sync: false
      - key: SEBPAY_BASE_URL
        sync: false
      - key: SEBPAY_WEBHOOK_SECRET
        sync: false
      - key: SEBPAY_STARTER_PLAN_ID
        sync: false
      - key: SEBPAY_PRO_PLAN_ID
        sync: false
      - key: SEBPAY_ENTERPRISE_PLAN_ID
        sync: false
      - key: SEBPAY_CREDITS_100_PLAN_ID
        sync: false
      - key: SEBPAY_CREDITS_500_PLAN_ID
        sync: false
      - key: SEBPAY_CREDITS_2000_PLAN_ID
        sync: false
      - key: SEBPAY_CREDITS_5000_PLAN_ID
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SEED_DATABASE
        value: "false"
    disks:
      - name: gen3ia-workspace
        mountPath: /tmp/gen3ia-workspace
        sizeGB: 10
  - type: cron
    name: gen3ia-refresh-tokens
    runtime: image
    schedule: "0 */4 * * *"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: false
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: CRON_JOB
        value: "refresh-tokens"
      - key: NEXT_PUBLIC_APP_URL
        fromService:
          type: web
          name: gen3ia-app
          property: host
